name: Release Conductor

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify tag and package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version"
          }
      - name: Build Windows release
        run: npm run dist:win
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          gh release create $env:GITHUB_REF_NAME `
            "release/Conductor-Setup-$version.exe" `
            "release/Conductor-Setup-$version.exe.blockmap" `
            "release/latest.yml" `
            --verify-tag `
            --generate-notes `
            --latest `
            --title "Conductor $version"
