name: Release Conductor

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: conductor-installed-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Downloading a workflow log needs admin rights on the repository, so a release that stops
      # here would otherwise say only "exit code 1". The tail of the run is re-emitted as an
      # annotation, which is readable from the run page and the public API.
      - name: Test
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'npm-test.log'
          npm test 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content -LiteralPath $log -Tail 80) -join "`n"
            $escaped = $tail -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
            Write-Output "::error title=npm test failed::$escaped"
            exit 1
          }
      - name: Select next installed-app version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $latestTag = gh release view --json tagName --jq .tagName 2>$null
          if ($LASTEXITCODE -eq 0 -and $latestTag -match '^v(\d+)\.(\d+)\.(\d+)$') {
            $version = "$($Matches[1]).$($Matches[2]).$([int]$Matches[3] + 1)"
          } else {
            $packageVersion = node -p "require('./package.json').version"
            if ($packageVersion -notmatch '^(\d+)\.(\d+)\.(\d+)$') { throw "Invalid package version $packageVersion" }
            $version = "$($Matches[1]).$($Matches[2]).$([int]$Matches[3] + 1)"
          }
          npm version $version --no-git-tag-version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build Windows release
        run: npm run dist:win
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          gh release create "v$version" `
            "release/Conductor-Setup-$version.exe" `
            "release/Conductor-Setup-$version.exe.blockmap" `
            "release/latest.yml" `
            --target $env:GITHUB_SHA `
            --generate-notes `
            --latest `
            --title "Conductor $version"
