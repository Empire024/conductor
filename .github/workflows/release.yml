name: Release Conductor

# Started by Conductor's delivery when a release is explicitly published (git.ship with
# publish: true, or the Source control panel's Publish switch), or by hand from the Actions page.
# Never on push: routine deliveries are local commits, and a hosted build per push was paying
# for a release nobody installed.
on:
  workflow_dispatch:

concurrency:
  group: conductor-installed-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Downloading a workflow log needs admin rights on the repository, so a release that stops
      # here would otherwise say only "exit code 1". The tail of the run is re-emitted as an
      # annotation, which is readable from the run page and the public API.
      - name: Test
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'npm-test.log'
          npm test 2>&1 | Tee-Object -FilePath $log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            # On a starved hosted runner a Vitest worker can time out reporting progress to the main
            # thread ("[vitest-worker]: Timeout calling onTaskUpdate") after every test has passed;
            # Vitest then exits 1 on that transport error alone. Only that exact shape is forgiven:
            # all files and tests passed, nothing failed, and every unhandled error is a worker RPC
            # timeout. The node script tests, which `npm test` skipped, still have to pass.
            $plain = (Get-Content -LiteralPath $log) -replace "`e\[[0-9;]*[A-Za-z]", ''
            $files = $plain | Where-Object { $_ -match '^\s*Test Files\s' } | Select-Object -Last 1
            $tests = $plain | Where-Object { $_ -match '^\s*Tests\s' } | Select-Object -Last 1
            $errors = @($plain | Where-Object { $_ -match '^(\w*Error|Error):' })
            $rpcOnly = $errors.Count -gt 0 -and @($errors | Where-Object { $_ -notmatch '^Error: \[vitest-worker\]: Timeout calling "' }).Count -eq 0
            if ($files -match 'passed' -and $files -notmatch 'failed' -and $tests -match 'passed' -and $tests -notmatch 'failed' -and $rpcOnly) {
              Write-Output "::warning title=Vitest worker RPC timeout::All tests passed; forgiving $($errors.Count) worker RPC timeout(s) on the hosted runner."
              npm run test:scripts 2>&1 | Tee-Object -FilePath $log -Append
              $testExit = $LASTEXITCODE
            }
          }
          if ($testExit -ne 0) {
            # One annotation holds about 4,000 characters, so a plain 80-line tail was cut off
            # before the failing test. Emit the lines that explain a failure first, then the
            # last lines, each split into annotations small enough to survive whole.
            $clean = Get-Content -LiteralPath $log | ForEach-Object { $_ -replace "`e\[[0-9;]*[A-Za-z]", '' }
            $failing = @($clean | Where-Object { $_ -match 'FAIL|×|✗|AssertionError|Error:|Timeout|not ok|Test Files|Tests |fail [1-9]' } | Select-Object -Last 60)
            $tail = @($clean | Select-Object -Last 25)
            $emit = {
              param($title, $lines)
              $body = ($lines -join "`n")
              for ($i = 0; $i -lt $body.Length; $i += 3600) {
                $chunk = $body.Substring($i, [Math]::Min(3600, $body.Length - $i))
                $escaped = $chunk -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
                Write-Output "::error title=$title $([int]($i / 3600) + 1)::$escaped"
              }
            }
            & $emit 'npm test failures' $failing
            & $emit 'npm test tail' $tail
            exit 1
          }
      - name: Select next installed-app version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $latestTag = gh release view --json tagName --jq .tagName 2>$null
          if ($LASTEXITCODE -eq 0 -and $latestTag -match '^v(\d+)\.(\d+)\.(\d+)$') {
            $version = "$($Matches[1]).$($Matches[2]).$([int]$Matches[3] + 1)"
          } else {
            $packageVersion = node -p "require('./package.json').version"
            if ($packageVersion -notmatch '^(\d+)\.(\d+)\.(\d+)$') { throw "Invalid package version $packageVersion" }
            $version = "$($Matches[1]).$($Matches[2]).$([int]$Matches[3] + 1)"
          }
          npm version $version --no-git-tag-version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build Windows release
        run: npm run dist:win
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          gh release create "v$version" `
            "release/Conductor-Setup-$version.exe" `
            "release/Conductor-Setup-$version.exe.blockmap" `
            "release/latest.yml" `
            --target $env:GITHUB_SHA `
            --generate-notes `
            --latest `
            --title "Conductor $version"
