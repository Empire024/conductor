<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#090b0e">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Watch and steer this Conductor's agents from your phone.">
    <!-- Home Screen install on iOS reads these four, not the manifest. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Conductor">
    <meta name="format-detection" content="telephone=no">
    <title>Conductor</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icon-180.png">
    <link rel="stylesheet" href="/app.css">
    <!-- Not deferred: the boot guard has to be listening before app.js can fail. -->
    <script src="/boot.js"></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div id="app" class="app" aria-live="polite"></div>
    <div id="overlay" class="overlay">
      <div id="pill" class="pill" hidden>Reconnecting&hellip;</div>
      <div id="toasts" class="toasts"></div>
    </div>
    <noscript>
      <p style="padding:24px;color:#a3a9b2;font:16px system-ui">Conductor needs JavaScript to talk to this computer.</p>
    </noscript>
  </body>
</html>
