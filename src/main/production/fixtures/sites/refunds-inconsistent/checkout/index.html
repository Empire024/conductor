<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout – Example Shop</title>
</head>
<body class="woocommerce">
  <header>
    <nav aria-label="Main">
      <a href="/">Home</a>
      <a href="/product/alpha/">Shop</a>
      <a href="/cart/">Cart</a>
    </nav>
  </header>
  <main>
    <h1>Checkout</h1>
    <form name="checkout" method="post" class="checkout" action="/checkout/submit">
      <label>Email address <input type="email" name="billing_email" required></label>
      <p>By ordering you accept our <a href="/terms/">terms</a>.</p>
      <button type="submit" id="place_order">Place order</button>
    </form>
  </main>
  <footer>
    <a href="/terms/">Terms and conditions</a>
    <a href="/privacy-policy/">Privacy policy</a>
    <p>Example Shop s.r.o., Hlavná 1, 811 01 Bratislava, Slovakia</p>
  </footer>
</body>
</html>
