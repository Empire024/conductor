<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alpha vase – Example Shop</title>
</head>
<body class="woocommerce">
  <header>
    <nav aria-label="Main">
      <a href="/">Home</a>
      <a href="/product/alpha/">Shop</a>
      <a href="/cart/">Cart</a>
    </nav>
  </header>
  <main>
    <div class="product">
      <div class="summary">
        <h1 class="product_title">Alpha vase</h1>
        <p class="price"><span class="woocommerce-Price-amount amount"><bdi>19,90&nbsp;<span class="woocommerce-Price-currencySymbol">€</span></bdi></span></p>

        <form class="cart" method="post" action="/cart/">
          <input type="hidden" name="product_id" value="11">
          <input type="number" name="quantity" value="1" min="1" aria-label="Quantity">
          <button type="submit" name="add-to-cart" value="11">Add to cart</button>
        </form>
      </div>
    </div>
  </main>
  <footer>
    <a href="/terms/">Terms and conditions</a>
    <a href="/privacy-policy/">Privacy policy</a>
    <p>Example Shop s.r.o., Hlavná 1, 811 01 Bratislava, Slovakia</p>
