<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart – Example Shop</title>
</head>
<body class="woocommerce">
  <header>
    <nav aria-label="Main">
      <a href="/">Home</a>
      <a href="/product/alpha/">Shop</a>
      <a href="/cart/">Cart</a>
    </nav>
  </header>
  <main>
    <h1>Cart</h1>
    <table class="shop_table cart">
      <thead><tr><th>Product</th><th>Subtotal</th></tr></thead>
      <tbody>
        <tr class="cart_item"><td class="product-name">Alpha vase × 1</td><td class="product-subtotal"><span class="woocommerce-Price-amount amount"><bdi>19,90&nbsp;<span class="woocommerce-Price-currencySymbol">€</span></bdi></span></td></tr>
      </tbody>
    </table>
    <div class="cart_totals">
      <table>
        <tr class="cart-subtotal"><th>Subtotal</th><td><span class="woocommerce-Price-amount amount"><bdi>19,90&nbsp;<span class="woocommerce-Price-currencySymbol">€</span></bdi></span></td></tr>
      </table>
      <p>Shipping and any fees are calculated at checkout.</p>
      <a href="/checkout/">Proceed to checkout</a>
    </div>
  </main>
  <footer>
    <a href="/terms/">Terms and conditions</a>
    <a href="/privacy-policy/">Privacy policy</a>
    <p>Example Shop s.r.o., Hlavná 1, 811 01 Bratislava, Slovakia</p>
  </footer>
</body>
</html>
