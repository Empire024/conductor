<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="generator" content="WordPress 6.6.2">
  <title>Log in – Baseline Shop</title>
  <link rel="stylesheet" href="/wp-content/themes/baseline/style.css">
  <script src="/wp-content/plugins/woocommerce/assets/js/frontend/woocommerce.js"></script>
  <script src="/js/consent.js" defer></script>
</head>
<body class="woocommerce">
  <header>
    <nav aria-label="Main">
      <a href="/">Home</a>
      <a href="/shop/">Shop</a>
      <a href="/contact/">Contact</a>
      <a href="/login/">Log in</a>
      <a href="/cart/">Cart</a>
    </nav>
  </header>
  <main>
    <h1>Log in</h1>
    <form id="login" method="post" action="/login/submit">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" style="width: 240px; height: 32px; font-size: 20px; background: #fff; color: #c00">
      <button type="submit">Log in</button>
    </form>
  </main>
  <footer>
    <a href="/privacy-policy/">Privacy policy</a>
    <a href="/terms/">Terms and conditions</a>
    <button type="button" data-consent-action="open">Cookie settings</button>
  </footer>
  <div id="cookie-banner" role="dialog" aria-label="Cookie consent" hidden>
    <p>We use cookies for analytics with your consent.</p>
    <button type="button" data-consent-action="accept">Accept all</button>
    <button type="button" data-consent-action="reject">Reject all</button>
    <button type="button" data-consent-action="settings">Settings</button>
    <div id="cookie-preferences" hidden>
      <label><input type="checkbox" data-consent-category="necessary" checked disabled> Necessary</label>
      <label><input type="checkbox" data-consent-category="analytics"> Analytics</label>
      <label><input type="checkbox" data-consent-category="marketing"> Marketing</label>
      <button type="button" data-consent-action="save">Save choices</button>
    </div>
  </div>
</body>
</html>
