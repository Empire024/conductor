<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout – Example Shop</title>
</head>
<body class="woocommerce">
  <header>
    <nav aria-label="Main">
      <a href="/">Home</a>
      <a href="/product/alpha/">Shop</a>
      <a href="/cart/">Cart</a>
    </nav>
  </header>
  <main>
    <h1>Checkout</h1>
    <form name="checkout" method="post" class="checkout woocommerce-checkout" action="{{woo}}/store/checkout">
      <label>First name <input type="text" name="billing_first_name" autocomplete="given-name" required></label>
      <label>Email address <input type="email" name="billing_email" autocomplete="email" required></label>
      <input type="hidden" name="currency" value="EUR">
      <input type="hidden" name="line" value="Alpha vase|19.90">
      <input type="hidden" name="fee" value="Courier|3.50">
      <div id="order_review">
        <table class="shop_table woocommerce-checkout-review-order-table">
          <tbody>
            <tr class="cart_item"><td class="product-name">Alpha vase × 1</td><td class="product-total"><span class="woocommerce-Price-amount amount"><bdi>19,90&nbsp;<span class="woocommerce-Price-currencySymbol">€</span></bdi></span></td></tr>
          </tbody>
          <tfoot>
            <tr class="cart-subtotal"><th>Subtotal</th><td><span class="woocommerce-Price-amount amount"><bdi>19,90&nbsp;<span class="woocommerce-Price-currencySymbol">€</span></bdi></span></td></tr>
            <tr class="woocommerce-shipping-totals shipping"><th>Shipping</th><td>Courier: <span class="woocommerce-Price-amount amount"><bdi>3,50&nbsp;<span class="woocommerce-Price-currencySymbol">€</span></bdi></span></td></tr>
            <tr class="order-total"><th>Total</th><td><strong><span class="woocommerce-Price-amount amount"><bdi>23,40&nbsp;<span class="woocommerce-Price-currencySymbol">€</span></bdi></span></strong></td></tr>
          </tfoot>
        </table>
      </div>
      <p>By placing the order you agree to the <a href="/terms/">terms and conditions</a>.</p>
      <button type="submit" id="place_order" name="woocommerce_checkout_place_order">Place order</button>
    </form>
  </main>
  <footer>
    <a href="/terms/">Terms and conditions</a>
    <a href="/privacy-policy/">Privacy policy</a>
    <p>Example Shop s.r.o., Hlavná 1, 811 01 Bratislava, Slovakia</p>
  </footer>
</body>
</html>
