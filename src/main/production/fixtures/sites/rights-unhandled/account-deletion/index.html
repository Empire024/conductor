<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Close your account – Example Shop</title>
</head>
<body class="woocommerce">
  <header>
    <nav aria-label="Main">
      <a href="/">Home</a>
      <a href="/product/alpha/">Shop</a>
      <a href="/cart/">Cart</a>
    </nav>
  </header>
  <main>
    <h1>Close your account</h1>
    <form class="account-deletion" method="post" action="/account-deletion/submit">
      <label>Email address <input type="email" name="email" required></label>
      <label>Birth number <input type="text" name="birth_number" required></label>
      <label>Scan of your passport or ID card <input type="file" name="id_document" required></label>
      <button type="submit">Request deletion</button>
    </form>
  </main>
  <footer>
    <a href="/terms/">Terms and conditions</a>
    <a href="/privacy-policy/">Privacy policy</a>
    <p>Example Shop s.r.o., Hlavná 1, 811 01 Bratislava, Slovakia</p>
  </footer>
</body>
</html>
